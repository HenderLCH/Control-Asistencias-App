name: contro_asistencias
description: "Control de Asistencias - Colegio Nuestra Señora de la Consolación de Táriba"
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Iconos
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.9.0

  # Estado / Navegación
  go_router: ^14.8.1
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Imágenes
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # CSV
  csv: ^6.0.0
  file_picker: ^8.1.7

  # PDF / Reportes
  pdf: ^3.11.2
  printing: ^5.13.2
  excel: ^4.0.6

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  http: ^1.2.0
  equatable: ^2.0.7
  flutter_slidable: ^3.1.1
  badges: ^3.1.2
  percent_indicator: ^4.2.3
  table_calendar: ^3.1.3
  fl_chart: ^0.70.2
  data_table_2: ^2.5.15

  # Permisos
  permission_handler: ^11.3.1
  flutter_local_notifications: ^22.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  googleapis_auth: ^2.3.4
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
